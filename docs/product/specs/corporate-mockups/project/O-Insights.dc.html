<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F5F6F6; color: #1A1C1E; font-family: Inter, -apple-system, sans-serif; font-optical-sizing: auto; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; box-sizing: border-box">

  <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">

      </div>
    </section>

    <section aria-label="Attendance" style="border-radius: 12px; background: #FFFFFF; box-shadow: 0 0 0 1px #E3E5E6">

      </div>
    </section>

    <section aria-label="Hours by day" style="border-radius: 12px; background: #FFFFFF; box-shadow: 0 0 0 1px #E3E5E6">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 16px; box-shadow: inset 0 -1px 0 #EDEEEF">

          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 13px; color: #6B7075">88</span><span style="width: 24px; height: 86px; border-radius: 4px 4px 0 0; background: #0B6E69"></span></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 13px; color: #6B7075">98</span><span style="width: 24px; height: 96px; border-radius: 4px 4px 0 0; background: #0B6E69"></span></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 13px; color: #6B7075">112</span><span style="width: 24px; height: 110px; border-radius: 4px 4px 0 0; background: #0B6E69"></span></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 13px; color: #6B7075">110</span><span style="width: 24px; height: 108px; border-radius: 4px 4px 0 0; background: #0B6E69"></span></div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 13px; color: #6B7075">86</span><span style="width: 24px; height: 84px; border-radius: 4px 4px 0 0; background: #0B6E69"></span></div>
        </div>
        <div aria-hidden="true" style="margin-top: 6px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 13px; color: #6B7075"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div>

    </section>
  </div>
</div>
