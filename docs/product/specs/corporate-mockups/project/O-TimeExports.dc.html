<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F5F6F6; color: #1A1C1E; font-family: Inter, -apple-system, sans-serif; font-optical-sizing: auto; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; box-sizing: border-box">

  <header style="background: #FFFFFF; box-shadow: 0 1px 0 #E3E5E6; padding: 52px 16px 12px">

      <h1 style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 600; white-space: nowrap">Time exports</h1>
      <span></span>
    </div>
  </header>

  <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="export-period" style="font-size: 13px; font-weight: 600; color: #4A4F54">Pay period</label>
      <div style="position: relative">
        <select id="export-period" style="box-sizing: border-box; width: 100%; height: 48px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D5D8DA; padding: 0 40px 0 12px; font: 400 15px Inter, sans-serif; color: #1A1C1E; -webkit-appearance: none; appearance: none">
          <option selected>Oct 19 – 25 · Last week</option>
          <option>Oct 12 – 18</option>
          <option>Oct 5 – 11</option>
        </select>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A4F54" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 14px; top: 16px; pointer-events: none"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>

    <section aria-labelledby="send-to" style="border-radius: 12px; background: #FFFFFF; box-shadow: 0 0 0 1px #E3E5E6">
      <div style="display: flex; align-items: center; height: 44px; padding: 0 16px; box-shadow: inset 0 -1px 0 #EDEEEF">
        <span id="send-to" style="font-size: 13px; font-weight: 600; color: #4A4F54">Send to</span>
      </div>
      <div role="radiogroup" aria-labelledby="send-to">
        <label style="position: relative; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; cursor: pointer">
          <input type="radio" name="provider" value="adp" checked style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">ADP RUN</span><span style="font-size: 13px; color: #6B7075">Last used Oct 20</span></span>
          <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF; box-shadow: inset 0 0 0 6px #0B6E69"></span>
        </label>
        <label style="position: relative; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; cursor: pointer; box-shadow: inset 0 1px 0 #EDEEEF">
          <input type="radio" name="provider" value="gusto" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Gusto</span><span style="font-size: 13px; color: #6B7075">Hours by person and day</span></span>
          <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #D5D8DA"></span>
        </label>
        <label style="position: relative; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; cursor: pointer; box-shadow: inset 0 1px 0 #EDEEEF">
          <input type="radio" name="provider" value="quickbooks" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">QuickBooks</span><span style="font-size: 13px; color: #6B7075">QuickBooks Online time</span></span>
          <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #D5D8DA"></span>
        </label>
        <label style="position: relative; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; cursor: pointer; box-shadow: inset 0 1px 0 #EDEEEF">
          <input type="radio" name="provider" value="csv" style="position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0">
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">CSV file</span><span style="font-size: 13px; color: #6B7075">Opens in Excel or Numbers</span></span>
          <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #D5D8DA"></span>
        </label>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 12px 16px; box-shadow: inset 0 1px 0 #EDEEEF">
        <span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600; white-space: nowrap">26 people · 684 h</span><span style="font-size: 13px; color: #8A4B00">3 timecards still need approval</span></span>
        <button type="button" style="width: 100%; height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: #0B6E69; color: #FFFFFF; font: 600 15px Inter, sans-serif">Create export</button>
      </div>
    </section>

    <section aria-label="Recent exports" style="border-radius: 12px; background: #FFFFFF; box-shadow: 0 0 0 1px #E3E5E6">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 16px; box-shadow: inset 0 -1px 0 #EDEEEF">
        <span style="font-size: 13px; font-weight: 600; color: #4A4F54">Recent exports</span>
        <a href="#" style="font-size: 13px; font-weight: 600; text-decoration: none">See all</a>
      </div>
      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; text-decoration: none; color: #1A1C1E">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Oct 12 – 18 · ADP RUN</span><span style="font-size: 13px; color: #6B7075">Oct 20 · Carmen Ortiz</span></span>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A7ACB1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; box-shadow: inset 0 1px 0 #EDEEEF; text-decoration: none; color: #1A1C1E">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Oct 5 – 11 · ADP RUN</span><span style="font-size: 13px; color: #6B7075">Oct 13 · Luis Medina</span></span>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A7ACB1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </a>
    </section>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; box-shadow: 0 -1px 0 #E3E5E6; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-top: 8px; box-sizing: border-box">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B7075; text-decoration: none; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7V20a.5.5 0 0 1-.5.5h-4.5v-6h-7v6H4a.5.5 0 0 1-.5-.5z"/></svg>Home</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B7075; text-decoration: none; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>Schedule</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B7075; text-decoration: none; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Time</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #0B6E69; text-decoration: none; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg>Payroll</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B7075; text-decoration: none; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 13.5a6 6 0 0 1 3.5 6.5"/></svg>Team</a>
  </nav>
</div>
