<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F5F6F6; color: #1A1C1E; font-family: Inter, -apple-system, sans-serif; font-optical-sizing: auto; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; box-sizing: border-box">

      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 16px; text-decoration: none; color: #1A1C1E">

      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 16px; box-shadow: inset 0 1px 0 #EDEEEF; text-decoration: none; color: #1A1C1E">
        <span style="flex: 1; font-size: 15px">Account</span>
        <span style="font-size: 15px; color: #4A4F54">Active</span>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A7ACB1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </a>
    </section>

    <section aria-label="Password" style="border-radius: 12px; background: #FFFFFF; box-shadow: 0 0 0 1px #E3E5E6">

    </section>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 108px">
    <button type="button" aria-describedby="deactivate-note" style="width: 100%; height: 44px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #B42318; color: #B42318; font: 600 15px Inter, sans-serif">Deactivate Alexandra</button>
    <div id="deactivate-note" style="margin-top: 8px; text-align: center; font-size: 13px; color: #6B7075">Her pay history stays. You can bring her back later.</div>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; box-shadow: 0 -1px 0 #E3E5E6; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-top: 8px; box-sizing: border-box">

    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B7075; text-decoration: none; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>Schedule</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B7075; text-decoration: none; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Time</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B7075; text-decoration: none; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg>Payroll</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #0B6E69; text-decoration: none; font-size: 11px; font-weight: 600"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 13.5a6 6 0 0 1 3.5 6.5"/></svg>Team</a>
