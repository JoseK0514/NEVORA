<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Message team</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6E69}a:hover{color:#084F4B}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F5F6F6; color: #1A1C1E; font-family: Inter, -apple-system, sans-serif; font-optical-sizing: auto; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; box-sizing: border-box">

  <div aria-hidden="true" inert="">
    <div style="background: #FFFFFF; box-shadow: 0 1px 0 #E3E5E6; padding: 52px 16px 12px">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
        <span role="img" aria-label="NEVORA Workforce" style="display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 44px"><img src="assets/nevora-wordmark.png" alt="" style="display: block; height: 14px; width: auto; mix-blend-mode: multiply"><span aria-hidden="true" style="display: block; font-size: 9px; line-height: 12px; font-weight: 600; letter-spacing: 2.4px; margin-right: -2.4px; color: #6B7075; text-transform: uppercase">Workforce</span></span>
        <span style="width: 32px; height: 32px; margin-right: 6px; border-radius: 16px; background: #E6F1EF; color: #0B6E69; display: grid; place-items: center; font-size: 13px; font-weight: 600">PL</span>
      </div>
    </div>
    <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">
      <div><div style="font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.3px">Welcome back, Priya</div><div style="margin-top: 2px; font-size: 13px; color: #6B7075">Tuesday, October 27 · Lead at Condado</div></div>
      <div style="border-radius: 12px; background: #FFFFFF; box-shadow: 0 0 0 1px #E3E5E6">
        <div style="display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 16px; box-shadow: inset 0 -1px 0 #EDEEEF"><span style="font-size: 13px; font-weight: 600; color: #4A4F54">Today’s shift</span><span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; background: #E6F1EF; color: #0B6E69; font-size: 13px; font-weight: 600">On the clock</span></div>
        <div style="padding: 14px 16px 16px"><div style="font-size: 20px; line-height: 26px; font-weight: 600">6:00 AM – 2:00 PM</div><div style="margin-top: 2px; font-size: 15px; color: #4A4F54">Lead · Condado · 30 min meal</div><div style="height: 78px"></div></div>
      </div>
      <div style="height: 244px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 0 0 1px #E3E5E6"></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(26,28,30,0.40)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 16px 16px 0 0; background: #FFFFFF">
    <div aria-hidden="true" style="padding-top: 8px"><div style="width: 36px; height: 5px; border-radius: 3px; background: #D5D8DA; margin: 0 auto"></div></div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; height: 52px; padding: 0 16px; box-shadow: inset 0 -1px 0 #EDEEEF">
      <button type="button" style="justify-self: start; height: 44px; padding: 0; border: 0; background: none; color: #0B6E69; font: 400 15px Inter, sans-serif">Cancel</button>
      <h2 id="sheet-title" style="margin: 0; font-size: 17px; font-weight: 600">Message team</h2>
      <button type="button" style="justify-self: end; height: 44px; padding: 0; border: 0; background: none; color: #0B6E69; font: 600 15px Inter, sans-serif">Send</button>
    </div>

    <div style="padding: 16px 16px 34px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 13px; font-weight: 600; color: #4A4F54">To</div>
        <div style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 14px; border-radius: 8px; background: #F5F6F6">
          <span style="flex: 1; display: flex; flex-direction: column; min-width: 0"><span style="font-size: 15px; font-weight: 600">Today’s team at Condado</span><span style="font-size: 13px; color: #6B7075">3 people · Alexandra, Jordan, Dana</span></span>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="team-message" style="font-size: 13px; font-weight: 600; color: #4A4F54">Message</label>
        <textarea id="team-message" rows="5" maxlength="500" aria-describedby="team-message-count" style="width: 100%; height: 124px; box-sizing: border-box; padding: 12px 14px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 2px #0B6E69; color: #1A1C1E; font: 400 15px/20px Inter, sans-serif; resize: none">Morning team, the espresso machine at the bar gets serviced at 11:00 AM. Please use the back machine until noon. Thanks!</textarea>
        <div style="display: flex; justify-content: space-between; font-size: 13px; color: #6B7075"><span>Only these 3 people see it.</span><span id="team-message-count">120 / 500</span></div>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
