<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F5F6F6; color: #1A1C1E; font-family: Inter, -apple-system, sans-serif; font-optical-sizing: auto; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; box-sizing: border-box">

      <div style="border-radius: 12px; background: #FFFFFF; box-shadow: 0 0 0 1px #E3E5E6">
        <div style="display: flex; align-items: center; height: 44px; padding: 0 16px; box-shadow: inset 0 -1px 0 #EDEEEF; font-size: 13px; font-weight: 600; color: #4A4F54">People</div>

          <span style="width: 32px; height: 32px; flex: none; border-radius: 16px; background: #E6F1EF; color: #0B6E69; display: grid; place-items: center; font-size: 13px; font-weight: 600">AR</span>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="first-name" style="font-size: 13px; line-height: 16px; font-weight: 600; color: #4A4F54">First name</label>

        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="last-name" style="font-size: 13px; line-height: 16px; font-weight: 600; color: #4A4F54">Last name</label>
          <input id="last-name" type="text" autocomplete="family-name" value="Méndez" style="box-sizing: border-box; width: 100%; height: 48px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D5D8DA; padding: 0 12px; font: 400 15px Inter, sans-serif; color: #1A1C1E">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="phone" style="font-size: 13px; line-height: 16px; font-weight: 600; color: #4A4F54">Mobile phone</label>
        <input id="phone" type="tel" autocomplete="tel" value="(787) 555-0187" style="box-sizing: border-box; width: 100%; height: 48px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D5D8DA; padding: 0 12px; font: 400 15px Inter, sans-serif; color: #1A1C1E">

        <label for="email" style="font-size: 13px; line-height: 16px; font-weight: 600; color: #4A4F54">Email (optional)</label>
        <input id="email" type="email" autocomplete="email" placeholder="name@example.com" style="box-sizing: border-box; width: 100%; height: 48px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D5D8DA; padding: 0 12px; font: 400 15px Inter, sans-serif; color: #1A1C1E">
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="role" style="font-size: 13px; line-height: 16px; font-weight: 600; color: #4A4F54">Role</label>
          <div style="position: relative">
            <select id="role" style="box-sizing: border-box; width: 100%; height: 48px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D5D8DA; padding: 0 36px 0 12px; font: 400 15px Inter, sans-serif; color: #1A1C1E; -webkit-appearance: none; appearance: none"><option selected>Employee</option><option>Lead</option><option>Manager</option></select>
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A4F54" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 12px; top: 16px; pointer-events: none"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="location" style="font-size: 13px; line-height: 16px; font-weight: 600; color: #4A4F54">Location</label>
          <div style="position: relative">
            <select id="location" style="box-sizing: border-box; width: 100%; height: 48px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D5D8DA; padding: 0 36px 0 12px; font: 400 15px Inter, sans-serif; color: #1A1C1E; -webkit-appearance: none; appearance: none"><option>Condado</option><option>Old San Juan</option><option selected>Isla Verde</option><option>Hato Rey</option><option>Dorado</option></select>
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4A4F54" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 12px; top: 16px; pointer-events: none"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
