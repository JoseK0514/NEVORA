    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B7075; text-decoration: none; font-size: 11px; font-weight: 500"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg>Pay</a>
