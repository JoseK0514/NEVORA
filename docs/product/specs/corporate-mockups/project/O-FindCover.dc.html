<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F5F6F6; color: #1A1C1E; font-family: Inter, -apple-system, sans-serif; font-optical-sizing: auto; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; box-sizing: border-box">

      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Not available (3)</span><span style="font-size: 13px; color: #6B7075">Alexandra, Priya and Jordan are working</span></span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A7ACB1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </a>

    <p style="margin: 0; text-align: center; font-size: 13px; color: #6B7075">Sam gets a notification when you assign.</p>
