<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fix my time</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6E69}a:hover{color:#084F4B}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F5F6F6; color: #1A1C1E; font-family: Inter, -apple-system, sans-serif; font-optical-sizing: auto; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; box-sizing: border-box">

  <div aria-hidden="true" inert="">
    <div style="background: #FFFFFF; box-shadow: 0 1px 0 #E3E5E6; padding: 52px 16px 12px">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
        <span role="img" aria-label="NEVORA Workforce" style="display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 44px"><img src="assets/nevora-wordmark.png" alt="" style="display: block; height: 14px; width: auto; mix-blend-mode: multiply"><span aria-hidden="true" style="display: block; font-size: 9px; line-height: 12px; font-weight: 600; letter-spacing: 2.4px; margin-right: -2.4px; color: #6B7075; text-transform: uppercase">Workforce</span></span>
        <span style="width: 32px; height: 32px; margin-right: 6px; border-radius: 16px; background: #E6F1EF; color: #0B6E69; display: grid; place-items: center; font-size: 13px; font-weight: 600">AR</span>
      </div>
    </div>
    <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">
      <div><div style="font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.3px">Time</div><div style="margin-top: 2px; font-size: 13px; color: #6B7075">Oct 26 – Nov 1 · 7 h 32 min worked</div></div>
      <div style="height: 180px; border-radius: 12px; background: #FFFFFF; box-shadow: 0 0 0 1px #E3E5E6"></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(26,28,30,0.40)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; border-radius: 16px 16px 0 0; background: #FFFFFF">
    <div aria-hidden="true" style="padding-top: 8px"><div style="width: 36px; height: 5px; border-radius: 3px; background: #D5D8DA; margin: 0 auto"></div></div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; height: 52px; padding: 0 16px; box-shadow: inset 0 -1px 0 #EDEEEF">
      <button type="button" style="justify-self: start; height: 44px; padding: 0; border: 0; background: none; color: #0B6E69; font: 400 15px Inter, sans-serif">Cancel</button>
      <h2 id="sheet-title" style="margin: 0; font-size: 17px; font-weight: 600">Fix my time</h2>
      <button type="button" style="justify-self: end; height: 44px; padding: 0; border: 0; background: none; color: #0B6E69; font: 600 15px Inter, sans-serif">Send</button>
    </div>

    <div style="padding: 16px 16px 34px; display: flex; flex-direction: column; gap: 16px">
      <fieldset style="margin: 0; padding: 0; border: 0; min-width: 0">
        <legend style="float: left; width: 100%; padding: 0 0 6px; font-size: 13px; font-weight: 600; color: #4A4F54">What to fix</legend>
        <div style="clear: both; border-radius: 8px; background: #FFFFFF; box-shadow: 0 0 0 1px #D5D8DA">
          <label style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; cursor: pointer">
            <span style="flex: 1; font-size: 15px">Missed clock-in</span>
            <input type="radio" name="fix" value="missed-in" style="appearance: none; -webkit-appearance: none; flex: none; width: 20px; height: 20px; margin: 0; border-radius: 10px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #6B7075">
          </label>
          <label style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; box-shadow: inset 0 1px 0 #EDEEEF; cursor: pointer">
            <span style="flex: 1; font-size: 15px">Missed clock-out</span>
            <input type="radio" name="fix" value="missed-out" checked style="appearance: none; -webkit-appearance: none; flex: none; width: 20px; height: 20px; margin: 0; border-radius: 10px; background: #0B6E69; box-shadow: inset 0 0 0 2px #0B6E69, inset 0 0 0 6px #FFFFFF">
          </label>
          <label style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; box-shadow: inset 0 1px 0 #EDEEEF; cursor: pointer">
            <span style="flex: 1; font-size: 15px">Wrong time</span>
            <input type="radio" name="fix" value="wrong-time" style="appearance: none; -webkit-appearance: none; flex: none; width: 20px; height: 20px; margin: 0; border-radius: 10px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #6B7075">
          </label>
          <label style="display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 14px; box-shadow: inset 0 1px 0 #EDEEEF; cursor: pointer">
            <span style="flex: 1; font-size: 15px">Missed break</span>
            <input type="radio" name="fix" value="missed-break" style="appearance: none; -webkit-appearance: none; flex: none; width: 20px; height: 20px; margin: 0; border-radius: 10px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #6B7075">
          </label>
        </div>
      </fieldset>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="fix-day" style="font-size: 13px; font-weight: 600; color: #4A4F54">Day</label>
        <input id="fix-day" type="text" value="Fri, Oct 23 · Old San Juan" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D5D8DA; color: #1A1C1E; font: 400 15px Inter, sans-serif">
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
          <label for="fix-start" style="font-size: 13px; font-weight: 600; color: #4A4F54">Start</label>
          <input id="fix-start" type="text" value="10:00 AM" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D5D8DA; color: #1A1C1E; font: 400 15px Inter, sans-serif">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
          <label for="fix-end" style="font-size: 13px; font-weight: 600; color: #4A4F54">End</label>
          <input id="fix-end" type="text" value="6:00 PM" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #D5D8DA; color: #1A1C1E; font: 400 15px Inter, sans-serif">
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="fix-note" style="font-size: 13px; font-weight: 600; color: #4A4F54">Note (required)</label>
        <textarea id="fix-note" rows="2" required style="width: 100%; height: 68px; box-sizing: border-box; padding: 12px 14px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: inset 0 0 0 2px #0B6E69; color: #1A1C1E; font: 400 15px/20px Inter, sans-serif; resize: none">Forgot to clock out after closing. I left at 6:00&nbsp;PM.</textarea>
        <div style="font-size: 13px; color: #6B7075">Ana Colón checks it before payroll. Your timecard changes once she approves.</div>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
