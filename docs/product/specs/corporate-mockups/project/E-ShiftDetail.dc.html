  <div aria-hidden="true" inert="">
    <div style="background: #FFFFFF; box-shadow: 0 1px 0 #E3E5E6; padding: 52px 16px 12px">

        <span style="width: 32px; height: 32px; margin-right: 6px; border-radius: 16px; background: #E6F1EF; color: #0B6E69; display: grid; place-items: center; font-size: 13px; font-weight: 600">AR</span>
      </div>
    </div>
    <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 12px">
      <div><div style="font-size: 22px; line-height: 28px; font-weight: 600; letter-spacing: -0.3px">Schedule</div><div style="margin-top: 2px; font-size: 13px; color: #6B7075">Oct 26 – Nov 1 · 4 shifts · 32 h</div></div>

    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(26,28,30,0.40)"></div>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; height: 52px; padding: 0 16px; box-shadow: inset 0 -1px 0 #EDEEEF">

      <h2 id="sheet-title" style="margin: 0; font-size: 17px; font-weight: 600">Thu, Oct 29</h2>
      <button type="button" style="justify-self: end; height: 44px; padding: 0; border: 0; background: none; color: #0B6E69; font: 600 15px Inter, sans-serif">Done</button>
    </div>

    <div style="padding: 16px 16px 34px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
        <div>
          <div style="font-size: 20px; line-height: 26px; font-weight: 600">8:00 AM – 4:00 PM</div>
          <div style="margin-top: 2px; font-size: 15px; color: #4A4F54">Barista · Condado</div>
          <div style="margin-top: 2px; font-size: 13px; color: #6B7075">8 h · 30 min meal · Lead: Priya Lal</div>
        </div>

            <span style="width: 32px; height: 32px; border-radius: 16px; background: #E6F1EF; color: #0B6E69; display: grid; place-items: center; font-size: 13px; font-weight: 600">PL</span>
            <span style="width: 32px; height: 32px; border-radius: 16px; background: #EDEEEF; color: #4A4F54; display: grid; place-items: center; font-size: 13px; font-weight: 600">MS</span>
            <span style="width: 32px; height: 32px; border-radius: 16px; background: #E6F1EF; color: #0B6E69; display: grid; place-items: center; font-size: 13px; font-weight: 600">SO</span>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column; min-width: 0"><span style="font-size: 13px; color: #6B7075">Working with</span><span style="font-size: 15px">Priya, Marco and Sam</span></span>
        </div>
      </section>

      <section aria-label="Shift actions" style="border-radius: 12px; background: #FFFFFF; box-shadow: 0 0 0 1px #E3E5E6">
        <a href="#" style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; text-decoration: none; color: #1A1C1E">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A4F54" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/></svg>
          <span style="flex: 1; font-size: 15px; font-weight: 600">Swap with someone</span>
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A7ACB1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </a>
        <a href="#" style="display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 16px; box-shadow: inset 0 1px 0 #EDEEEF; text-decoration: none; color: #1A1C1E">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A4F54" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M19 8v6M16 11h6"/></svg>
          <span style="flex: 1; font-size: 15px; font-weight: 600">Offer for cover</span>
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A7ACB1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </a>
        <a href="#" style="display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px; box-shadow: inset 0 1px 0 #EDEEEF; text-decoration: none; color: #B42318">
          <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6 18.4 18.4"/></svg>
          <span style="flex: 1; display: flex; flex-direction: column; min-width: 0"><span style="font-size: 15px; font-weight: 600">I can't work this shift</span><span style="font-size: 13px; color: #6B7075">Tells your manager right away</span></span>
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A7ACB1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
        </a>
      </section>
    </div>
  </section>
</div>
</x-dc>
