<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading size comparison</title>
<style>
@font-face { font-family: "Inter"; src: url("../../../../../public/fonts/typeface/inter/variable.woff2") format("woff2"); font-weight: 100 900; }
:root { --teal:#0B6E69; --ink:#111517; --ink2:#3F464B; --grey:#6A7176; --line:#ECEEEF; --canvas:#F2F5F4; --edge:#838A8F;
  --band: linear-gradient(160deg,#0C726C 0%,#0B6E69 40%,#08504C 100%);
  --elev: 0 0 0 1px rgb(16 40 38/.05),0 1px 2px rgb(16 40 38/.06),0 12px 28px -12px rgb(16 40 38/.18); }
* { box-sizing: border-box; }
body { margin: 0; padding: 24px; background: #DDE3E1; font-family: Inter, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.row { display: flex; gap: 28px; align-items: flex-start; }
.col h2 { font: 700 15px/20px Inter; margin: 0 0 10px; color: var(--ink); }
.col h2 small { display:block; font-weight:500; color:var(--grey); }
.phone { background: var(--canvas); border-radius: 28px; overflow: hidden; box-shadow: 0 10px 30px rgb(0 0 0/.15); }
.band { background: var(--band); color: #fff; padding: 22px 14px 70px; }
.band .back { font: 500 14px/18px Inter; opacity: .86; }
.band h1 { font: 600 24px/30px Inter; margin: 6px 0 2px; }
.band p { font: 400 14px/20px Inter; margin: 0; color: rgb(255 255 255/.86); }
.stack { padding: 0 14px 18px; margin-top: -54px; display: grid; gap: 12px; }
.card { background: #fff; border-radius: 22px; box-shadow: var(--elev); padding: 16px 18px; }
.who { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.av { width: 36px; height: 36px; border-radius: 50%; background: #E8F3F1; color: var(--teal); display: grid; place-items: center; font: 700 13px Inter; flex: none; }
.who b { display: block; font: 600 15.5px/20px Inter; }
.who span { font: 500 13.5px/18px Inter; color: var(--grey); }
.label { font: 600 12.5px/16px Inter; color: var(--grey); text-transform: none; margin: 0 0 6px; }
.chip { display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 8px; border-radius:999px; box-shadow:0 0 0 1px rgb(17 21 23/.12); font:600 12px Inter; color:var(--ink2); }
.chip i { width:6px; height:6px; border-radius:50%; background:#B8760F; }
.read { margin: 0; color: var(--ink); }
.v-now .read.req { font: 400 15.5px/22px Inter; }
.v-now .read.note { font: 400 14px/20px Inter; color: var(--ink2); }
.v-now .read.ai { font: 400 15.5px/22px Inter; }
.v-new .read { font: 400 17px/24px Inter; }
.v-mid .read { font: 400 16px/23px Inter; }
.v-mid .read.note { color: var(--ink2); }
.v-new .read.note { color: var(--ink2); }
.notes { display: grid; gap: 8px; }
.notes .read { background: #F7F9F9; border-radius: 14px; padding: 12px 14px; }
.src { margin-top: 10px; font: 500 13.5px/18px Inter; color: var(--grey); }
.rows .r { display:flex; justify-content:space-between; align-items:center; min-height:64px; border-top:1px solid var(--line); }
.rows .r:first-child { border-top:0; }
.rows b { display:block; font:600 15.5px/20px Inter; } .rows span { font:500 13.5px/18px Inter; color:var(--grey); }
.field { height: 48px; border-radius: 14px; box-shadow: inset 0 0 0 1px var(--edge); display:flex; align-items:center; padding: 0 14px; color: var(--grey); }
.v-now .field { font: 400 15px Inter; } .v-mid .field { font: 400 16px Inter; } .v-new .field { font: 400 16px Inter; }
.btns { display:flex; gap:8px; margin-top:14px; }
.btn { flex:1; height:44px; border-radius:10px; display:grid; place-items:center; font:600 15px Inter; }
.btn.p { background:var(--teal); color:#fff; } .btn.s { box-shadow:0 0 0 1px rgb(16 40 38/.12),0 1px 2px rgb(16 40 38/.08); }
</style></head>
<body>
<div class="row" id="root"></div>
<template id="screen">
  <div class="phone">
    <div class="band"><div class="back">‹ Requests</div><h1>Time off request</h1><p>Mon 1 Dec – Wed 3 Dec · 3 days</p></div>
    <div class="stack">
      <div class="card">
        <div class="who"><div class="av">LR</div><div><b>Lucía Rivera Ortiz</b><span>Cashier · Bayamón</span></div></div>
        <p class="label">Her note</p>
        <p class="read req" data-m="req">Hola, necesito estos tres días porque mi hija tiene una operación en el Centro Médico de Río Piedras y tengo que acompañarla. Ya hablé con Carmen para que cubra mi turno del lunes.</p>
        <div style="margin-top:12px"><span class="chip"><i></i>Waiting for you</span></div>
        <div class="btns"><div class="btn s">Decline</div><div class="btn p">Approve</div></div>
      </div>
      <div class="card">
        <p class="label">Notes</p>
        <div class="notes">
          <p class="read note" data-m="note">Carmen confirmed Monday. Tuesday and Wednesday still need cover on the morning shift.</p>
        </div>
      </div>
      <div class="card">
        <p class="label">Assistant</p>
        <p class="read ai" data-m="ai">2 people are already off on Tuesday, so approving leaves the morning shift 1 cashier short. Ana and José have no shifts that day.</p>
        <div class="src">From approved time off and the published schedule, updated 4:10 PM.</div>
      </div>
      <div class="card rows">
        <p class="label">Also off these days (rows: unchanged)</p>
        <div class="r"><div><b>Marisol Vega</b><span>Tue 2 Dec · Vacation</span></div></div>
        <div class="r"><div><b>Pedro Santiago</b><span>Tue 2 Dec · Sick</span></div></div>
      </div>
      <div class="card"><p class="label">Search field</p><div class="field">Search team</div></div>
    </div>
  </div>
</template>
<script>
const W = Number(new URLSearchParams(location.search).get('w') || 390);
const root = document.getElementById('root'), tpl = document.getElementById('screen');
for (const [cls, title, sub] of [['v-now','Now','Reading text 15.5px and 14px · field 15px'],['v-mid','Middle','Reading text 16px · field 16px'],['v-new','Proposed','Reading text 17px · field 16px']]) {
  const col = document.createElement('div'); col.className = 'col ' + cls; col.style.width = W + 'px';
  col.innerHTML = `<h2>${title} · ${W}px<small>${sub}</small></h2>`;
  col.appendChild(tpl.content.cloneNode(true)); root.appendChild(col);
}
</script>
</body></html>
