licable period applies, and a deletion request doesn\u2019t restart it.",BACKUP_EXPIRY:"Our database keeps a restore history of six hours. We are verifying the maximum time any backup or exported copy is kept, and will update this policy once it is confirmed.",PROCESSORS_AND_PURPOSES:"Vercel hosts the application and runs its servers; Neon stores the database; a transactional email provider delivers recovery codes and other account email; and your browser\u2019s push service, run by its maker (such as Apple, Google or Mozilla), delivers the notifications you turn on.",HOSTING_TRANSFER_DETAILS:"Our database and application servers are in the United States, in Northern Virginia. Email delivery, push notification services and our providers\u2019 logs and support may process information in other locations.",SALE_SHARING_AND_TRACKING_STATEMENT:"NEVORA does not display advertisements, sell personal information, or share personal information for cross-context behavioral advertising. We do not track users across other companies\u2019 applications or websites for advertising purposes. We disclose information to your employer and our service providers as necessary to operate NEVORA and for the purposes described in this policy.",EMPLOYER_DATA_RESPONSIBILITIES:"Your employer decides how NEVORA is used for workplace activities, including scheduling, attendance, timekeeping, payroll records and employee administration. VELANI LLC operates NEVORA and processes these workplace records on your employer\u2019s documented instructions. Requests about workplace records your employer controls are coordinated with your employer, and VELANI LLC helps locate, correct, export or delete information where appropriate. VELANI LLC handles requests about information it controls for its own business purposes, such as direct support communications and service administration. Your employer remains responsible for employment decisions, payroll accuracy, required workplace notices and its own recordkeeping obligations.",REGIONAL_PRIVACY_DETAILS:"NEVORA currently serves the participating employer and its authorized workforce in Puerto Rico. Applicable United States federal and Puerto Rico requirements govern the handling of relevant workplace records.",BUSINESS_CONTACT_DETAILS:"VELANI LLC, 1654 Calle Tulipan, Suite 100, San Juan, PR 00927"},requiredFacts:["EFFECTIVE_DATE","BUSINESS_CONTACT_DETAILS","EMPLOYER_DATA_RESPONSIBILITIES","PROCESSORS_AND_PURPOSES","SALE_SHARING_AND_TRACKING_STATEMENT","HOSTING_TRANSFER_DETAILS","BACKUP_EXPIRY","REGIONAL_PRIVACY_DETAILS","DELETION_COMPLETION_PERIOD","SUPPORT_RESPONSE_TIME","RETENTION_SCHEDULE"],documents:[{slug:"privacy",title:"Privacy Policy",effective:!0,summary:"How NEVORA handles information when you use it on the web or in its apps.",sections:[{heading:"Who we are",blocks:[{p:["NEVORA is a workforce scheduling and operations service provided by VELANI LLC. This policy explains how information is handled when you use NEVORA through its website or mobile applications. Contact us at ",{href:"mailto:support@thevelani.com",text:"support@thevelani.com"}," or by mail at ",{fact:"BUSINESS_CONTACT_DETAILS"},"."]}]},{heading:"Your workplace",blocks:[{p:["Your employer or organization supplies and manages the information used to run its workspace. Authorized people in your workplace can see information according to their roles."]},{p:[{fact:"EMPLOYER_DATA_RESPONSIBILITIES"}]},{p:["Contact your workplace administrator about schedules, pay records or corrections. You can also contact us about privacy, or use the account deletion process below."]}]},{heading:"Information NEVORA uses",blocks:[{p:["Depending on the features your organization turns on and your role, NEVORA handles:"]},{list:[["Account and work profile information, such as your name, sign-in and contact details, employee ID, role, workplace and assigned work locations."],["Scheduling and attendance information, such as shifts, availability, time-off requests, shift exchanges, recorded work and break times, corrections and approval history."],["Payroll-related information and documents where those features are turned on, including the pay records your organization enters."],["Workplace content, such as company updates, shift notes, requests and acknowledgements."],["Service and security information, such as sign-in and session records, access events, support requests and the technical information needed to deliver and protect the service."],["Notification delivery information, such as push subscriptions on devices where you turn notifications on."]]},{p:["Information comes from you, your organization and its authorized users, your use of NEVORA, and the service providers that perform these functions. If a feature needs a device permission, it explains why when it asks."]}]},{heading:"Why we use information",blocks:[{p:["To give you access to your account, show authorized work information, run scheduling and attendance features, process permitted requests, deliver workplace communications, provide payroll-related features your organization turns on, answer support requests, investigate misuse, protect accounts and meet applicable obligations."]}]},{heading:"Who receives information",blocks:[{p:["Your organization and its authorized users receive the information their roles need. Service providers process information for us: ",{fact:"PROCESSORS_AND_PURPOSES"}," We may disclose information when the law requires it, or when it\u2019s necessary to address fraud, security incidents or threats to anyone\u2019s rights or safety, as the law allows."]}]},{heading:"Advertising and tracking",blocks:[{p:[{fact:"SALE_SHARING_AND_TRACKING_STATEMENT"}]}]},{heading:"Where information is processed",blocks:[{p:[{fact:"HOSTING_TRANSFER_DETAILS"}]}]},{heading:"How long we keep information",blocks:[{p:["We keep information only as long as we need it. Each period follows the age of the record; a deletion request doesn\u2019t restart it. Where a record fits more than one category, the longest period applies."]},{list:[[{strong:"Attendance, approved timecards, payroll calculations, published pay statements"}," and their corrections and approvals: three years from the record\u2019s final entry, or longer when the employment-tax rule below or another requirement applies. They preserve wage calculations, payment history and evidence for payroll questions or disputes."],[{strong:"Records supporting employment taxes:"}," at least four years after the tax is due or paid, whichever is later."],[{strong:"Security and access logs NEVORA manages:"}," up to 90 days from the logged event, to investigate unauthorized access and keep the service secure."],[{strong:"Records of privacy requests:"}," 24 months after the request is closed, to show what was asked, how it was handled and any record kept."],[{strong:"Optional profile information and account data"}," with no continuing lawful purpose: removed within the deletion timetable below."],[{strong:"Records under a legal hold or unresolved dispute:"}," until the hold is released and the period that otherwise applies has passed."]]},{p:["When a record has to be kept, we limit its use and access to that purpose. Backups: ",{fact:"BACKUP_EXPIRY"}]}]},{heading:"Your choices and requests",blocks:[{p:["You can manage notifications in NEVORA and in your device settings. Use your profile, or ask your workplace administrator, to correct workplace information. Email ",{href:"mailto:support@thevelani.com",text:"support@thevelani.com"}," about access, correction, deletion or other privacy requests. We confirm your identity in a way that fits the request. ",{fact:"REGIONAL_PRIVACY_DETAILS"}]}]},{heading:"Deleting your account",blocks:[{p:["Open Profile, choose Delete my account, re-enter your password and confirm. If you no longer have the app, sign in to NEVORA on the web and do the same; see ",{href:"/account-deletion",text:"Account deletion"},". Before you confirm, we show what is removed and what may be kept for a specific obligation. We aim to complete eligible deletion requests within ",{fact:"DELETION_COMPLETION_PERIOD"},". We confirm it\u2019s you before deleting anything; if some information must be kept, or the law allows more time, we explain why and for how long. Deleting your NEVORA account doesn\u2019t change your employment."]}]},{heading:"Security",blocks:[{p:["We protect information with measures that fit it, including role-based access and encrypted connections. No way of storing or sending information removes every risk. Email ",{href:"mailto:support@thevelani.com",text:"support@thevelani.com"}," if you think someone else has used your account. Never send passwords, verification codes or payroll documents by email."]}]},{heading:"Changes",blocks:[{p:["NEVORA is meant for authorized workplace use. We post changes to this policy with a new effective date and give additional notice where required. Questions go to ",{href:"mailto:support@thevelani.com",text:"support@thevelani.com"},"."]}]}]},{slug:"terms",title:"Terms of Use",effective:!0,summary:"The rules for using NEVORA.",sections:[{heading:"Using NEVORA",blocks:[{p:["NEVORA is provided by VELANI LLC for authorized workforce scheduling and operations. Use it only for a workspace you\u2019re authorized to access, under these terms and applicable law. Your organization may have a separate service agreement with VELANI LLC."]}]},{heading:"Your account",blocks:[{p:["Keep your sign-in details private, give accurate information when asked, and report suspected unauthorized access to ",{href:"mailto:support@thevelani.com",text:"support@thevelani.com"},". Use only your own sign-in and permissions. Your organization manages work assignments and access by role. Report incorrect work records through the correction process or to your workplace administrator."]}]},{heading:"Work records and employment",blocks:[{p:["NEVORA helps record and share workplace information. Your employer remains responsible for its employment decisions, payroll obligations and workplace rules. Follow your workplace\u2019s approval process to change attendance or other work records. These terms don\u2019t waive any employment, wage, privacy or other legal rights."]}]},{heading:"Acceptable use",blocks:[{p:["Don\u2019t harass, threaten, impersonate, discriminate against or abuse anyone. Don\u2019t share unlawful or sexually exploitative content, expose someone\u2019s private information without authority, send malware, try to get access you aren\u2019t given, or falsify or tamper with work records. Use workplace communications for their intended purpose and respect intellectual property and confidentiality."]}]},{heading:"Your content",blocks:[{p:["You keep any rights you have in what you submit. You allow VELANI LLC, and the service providers working for it, to process it as needed to run NEVORA, deliver it to its intended audience, protect the service and meet applicable obligations. Only submit content you\u2019re allowed to share."]}]},{heading:"Reporting concerns",blocks:[{p:["Email ",{href:"mailto:support@thevelani.com",text:"support@thevelani.com"}," to report content or behavior that breaks these rules, including concerns about an administrator. Describe the item and where it appears, without extra personal information. We review concerns and may remove content or restrict accounts. Your workplace\u2019s own reporting channels are also available."]}]},{heading:"Privacy and deletion",blocks:[{p:["Our ",{href:"/privacy",text:"Privacy Policy"}," explains how information is handled and your choices. You can request account deletion from Profile; see ",{href:"/account-deletion",text:"Account deletion"},". Some workplace records may be kept for the specific purposes and periods explained there."]}]},{heading:"Access to the service",blocks:[{p:["Features depend on your role and your organization\u2019s settings. We may restrict access to address security incidents, misuse or loss of authorization. Email ",{href:"mailto:support@thevelani.com",text:"support@thevelani.com"}," about a restriction or a service problem. These terms don\u2019t create any charge for you."]}]},{heading:"App license",blocks:[{p:["For the iOS app, Apple\u2019s standard end-user license agreement applies unless VELANI LLC provides its own through the App Store. These terms apply alongside that license as the law allows."]}]},{heading:"Changes and contact",blocks:[{p:["We post updated terms with their effective date and give additional notice, or ask you to accept them, where required. Contact VELANI LLC at ",{href:"mailto:support@thevelani.com",text:"support@thevelani.com"}," or by mail at ",{fact:"BUSINESS_CONTACT_DETAILS"},"."]}]}]},{slug:"support",title:"Support",effective:!1,summary:"Get help with NEVORA, a workforce scheduling and operations product of VELANI LLC.",sections:[{heading:"Contact support",blocks:[{p:["Email ",{href:"mailto:support@thevelani.com",text:"support@thevelani.com"}," about sign-in problems, technical issues, feedback, privacy questions or content concerns. ",{fact:"SUPPORT_RESPONSE_TIME"}," Our mailing address: ",{fact:"BUSINESS_CONTACT_DETAILS"},"."]},{p:["Include the app version, your device and its operating system version, and what happened. Add your workspace name if we need it to find the problem. Remove personal information from screenshots. ",{strong:"Never email your password, a verification code, bank details or payroll documents."}]}]},{heading:"Questions about your work",blocks:[{p:["Ask your manager or workplace administrator about shifts, time-off decisions, pay or corrections to your work records. Contact NEVORA support if a problem in the app stops you from reaching them."]}]},{heading:"Signing in",blocks:[{p:["Use ",{href:"/forgot-access",text:"Forgot access"}," on the sign-in page. If you no longer have the email address on your account, ask your manager or Owner: they can verify you and give you a recovery code. We will never ask for your password or a verification code by email."]}]},{heading:"Privacy and account deletion",blocks:[{p:["Read our ",{href:"/privacy",text:"Privacy Policy"},", or see ",{href:"/account-deletion",text:"Account deletion"}," to start a request. You can do it on the web without the app."]}]},{heading:"Reporting content",blocks:[{p:["Email ",{href:"mailto:support@thevelani.com",text:"support@thevelani.com"}," with a short description of the item and where it appears, without unnecessary personal information."]}]}]},{slug:"account-deletion",title:"Delete your NEVORA account",effective:!1,summary:"You can ask us to delete your NEVORA account and the information linked to it, in the app or on the web.",sections:[{heading:"In the app or on the web",blocks:[{p:["Open Profile, choose ",{strong:"Delete my account"},", read what happens, re-enter your password and confirm. If you\u2019ve uninstalled the app, ",{href:"/login",text:"sign in to NEVORA on the web"}," and do the same; the page opens after you sign in."]},{p:["If you can\u2019t sign in, use ",{href:"/forgot-access",text:"Forgot access"}," first, or email ",{href:"mailto:support@thevelani.com",text:"support@thevelani.com"}," and we\u2019ll help you confirm it\u2019s you."]}]},{heading:"What happens next",blocks:[{p:["When you confirm, we save your request and show you a reference such as DEL-7KQ2M9XA. You\u2019re signed out on every device and can\u2019t sign in again. We aim to delete your account within ",{fact:"DELETION_COMPLETION_PERIOD"},", and we email you when it\u2019s done if we have your email address. Quote your reference to ",{href:"mailto:support@thevelani.com",text:"support@thevelani.com"}," to ask about it."]}]},{heading:"What is removed",blocks:[{p:["Your account and the information linked to it that can be deleted: your profile, sign-in details, sessions, notification subscriptions, calendar feed links and the content you contributed, including copies held by our service providers."]}]},{heading:"What may be kept",blocks:[{p:["Some attendance, payroll, security or dispute records may have to be kept for a recorded obligation. We keep ",{fact:"RETENTION_SCHEDULE"}," Backups: ",{fact:"BACKUP_EXPIRY"}," Kept records are restricted and never used to restore your account."]}]},{heading:"Your job and your workplace",blocks:[{p:["Deleting your NEVORA account doesn\u2019t end your employment or remove records your employer has to keep. If you\u2019re the Owner, your company\u2019s workspace stays open for the rest of your team; closing a workspace is separate, so email ",{href:"mailto:support@thevelani.com",text:"support@thevelani.com"}," to arrange it."]}]}]}],source:{commit:"46e202786863279302026ee03a0e225c359fa55c",file:"src/lib/legal/policies.ts",sha256:"81412e1baa25b5a3a5271856f3efa3e5896c245a90db0847b51274423f3fc7a9"},complete:!0};var q1=Ii.documents,Bn=Ii.facts,Lk=Ii.source,ir=Ii.email,ih=Ii.operator,Ds=Ii.version;function Bi(e=null,t=Bn){return e!=="off"&&e!=="missing-fact"&&Ii.requiredFacts.every(n=>typeof t[n]=="string"&&!!t[n].trim())}function O1(e){return q1.find(t=>t.slug===e)}var oh=["support","privacy","terms","account-deletion","signed-out","deletion-result"];function ga(e){return oh.includes(e)}function xs(e){return e===`mailto:${ir}`?"email":["/privacy","/terms","/support","/account-deletion"].includes(e)?e.slice(1):null}function td(e,t=null){let n={actor:be.id,proof:!0,active:!0,access:!0,legal:Bi(t),currentPolicy:!0,read:"ready",phase:"idle",outcome:"success",problem:"",sequence:0,operation:null,receipt:null};return e==="denied"&&(n.access=!1),(e==="foreign"||e==="foreign-receipt")&&(n.actor="another-employee"),e==="expired"&&(n.proof=!1),e==="disabled"&&(n.active=!1),e==="policy-changed"&&(n.currentPolicy=!1),(e==="loading"||e==="error")&&(n.read=e),["wrong-password","failed","unavailable","unknown","duplicate"].includes(e||"")&&(n.outcome=e),(e==="existing"||e==="foreign-receipt")&&(n.phase="duplicate",n.receipt={kind:"duplicate",reference
