name: Runner network diagnostic (not release verification)

on:
  push:
    tags: ["diagnostic/backend-network/**"]

permissions:
  contents: read

jobs:
  diagnose:
    name: runner-network-diagnostic-only
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - name: Collect bounded runner network evidence
        shell: bash
        run: |
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKOUT_SHA" = "$GITHUB_SHA"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS,GITHUB_EVENT_NAME,GITHUB_REF,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_TEMP,ImageOS,ImageVersion,RUNNER_ARCH \
            env NEVORA_DIAGNOSTIC_CHECKOUT_SHA="$CHECKOUT_SHA" \
            "$(command -v node)" scripts/ci-runner-network-diagnostic.mjs
      - name: Retain sanitized diagnostic receipt even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runner-network-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nevora-runner-network-diagnostic/receipt.json
          if-no-files-found: error
          retention-days: 14
