name: Development CI focused diagnostic
on:
  push:
    branches: [codex/browser-probe-20261022]
permissions:
  contents: read
jobs:
  typecheck-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Typecheck the corrected real dependency-copy regression
        run: npm run typecheck
      - name: Verify source is unchanged
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
