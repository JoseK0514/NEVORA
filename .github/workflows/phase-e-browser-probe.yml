name: Development CI focused diagnostic
on:
  push:
    branches: [codex/browser-probe-20261022]
permissions:
  contents: read
jobs:
  focused:
    name: focused (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [whole-d]
    env:
      PHASE_E_EXPECTED_SHA: ${{ github.sha }}
      PHASE_D2_CORRECTIONS_EXPECTED_SHA: ${{ github.sha }}
      PHASE_C_EXPECTED_SHA: ${{ github.sha }}
      PHASE_D_EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Set owned diagnostic evidence directories
        run: |
          echo "PHASE_E_EVIDENCE_DIR=$RUNNER_TEMP/diagnostic-${{ matrix.target }}" >> "$GITHUB_ENV"
          echo "PHASE_D2_CORRECTIONS_EVIDENCE_DIR=$RUNNER_TEMP/diagnostic-d2" >> "$GITHUB_ENV"
          echo "PHASE_C_EVIDENCE_DIR=$RUNNER_TEMP/diagnostic-clocker-browser" >> "$GITHUB_ENV"
          echo "PHASE_D_EVIDENCE_DIR=$RUNNER_TEMP/diagnostic-whole-d" >> "$GITHUB_ENV"
      - name: Runtime observer registration regression
        if: ${{ matrix.target == 'readiness' }}
        run: npx --no-install vitest run src/test/phase-e-browser-runtime.test.ts
      - name: Install pinned browser runtime
        run: |
          PW_ROOT="$GITHUB_WORKSPACE/tools/ci-browser-runtime"
          npm ci --prefix "$PW_ROOT" --no-audit --no-fund
          npm audit --prefix "$PW_ROOT" --audit-level=high
          echo "NEVORA_PLAYWRIGHT_BIN=$PW_ROOT/node_modules/.bin/playwright" >> "$GITHUB_ENV"
          echo "NEVORA_PLAYWRIGHT_RUNTIME_PACKAGE=$PW_ROOT/package.json" >> "$GITHUB_ENV"
      - name: Prefer official Ubuntu archive
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS "$(command -v node)" scripts/ci-ubuntu-mirrors.mjs
      - name: Install Chromium and WebKit
        timeout-minutes: 8
        run: '"$NEVORA_PLAYWRIGHT_BIN" install --with-deps chromium webkit'
      - name: Install scratch PostgreSQL runtime
        if: ${{ matrix.target != 'readiness' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16
          echo "NEVORA_TEST_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
      - name: Full shared-server Home matrix with actual authenticated arrival
        if: ${{ matrix.target == 'home' }}
        run: node scripts/phase-e-owned.mjs browser --suite home
      - name: Actual Home and independent recorded-time readiness controls
        if: ${{ matrix.target == 'home' || matrix.target == 'readiness' }}
        env:
          NODE_ENV: test
          HOME_READINESS_EVIDENCE_DIR: ${{ runner.temp }}/diagnostic-home-readiness
        run: node --import ./scripts/qa-server-context.mjs --import tsx scripts/phase-e-home-held-response.check.mjs
      - name: Complete D2 correction, recovery and identity-boundary browser cases
        if: ${{ matrix.target == 'd2' }}
        run: npm run test:phase-d2:corrections-ui
      - name: Controlled feedback and reviewed-view readiness regressions
        if: ${{ matrix.target == 'home-trace' }}
        run: node scripts/browser-render-readiness.check.mjs
      - name: Navigation WebKit390 fresh authorized decision before account switch
        if: ${{ matrix.target == 'home-trace' }}
        run: node scripts/phase-d-owned.mjs contrast-probe
      - name: Complete Phase D both engines with actual tablet foreground precondition
        if: ${{ matrix.target == 'whole-d' }}
        run: node scripts/phase-d-owned.mjs browser
      - name: Strict mirror custody and release-engineering regressions
        if: ${{ matrix.target == 'clocker' }}
        run: |
          npm run test:release-engineering
          NEVORA_MIRROR_EVIDENCE_DIR="$RUNNER_TEMP/diagnostic-mirror-mutated" node --import tsx scripts/release-mirror-custody-qa.mjs mutated
          NEVORA_MIRROR_EVIDENCE_DIR="$RUNNER_TEMP/diagnostic-mirror-extra" node --import tsx scripts/release-mirror-custody-qa.mjs extra
      - name: Full Clocker PostgreSQL suite
        if: ${{ matrix.target == 'clocker' }}
        run: npm run test:clocker:owned
      - name: Full Clocker lifecycle and recovery browser suite
        if: ${{ matrix.target == 'clocker' || matrix.target == 'clocker-browser' }}
        run: node scripts/phase-c-clocker-postgres.mjs --punch-ui
      - name: Upload scoped diagnostic evidence; not development acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-ci-probe-${{ github.sha }}-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/diagnostic-*/*.json
            ${{ runner.temp }}/diagnostic-*/*.png
            ${{ runner.temp }}/diagnostic-*/chromium-*/*.json
            ${{ runner.temp }}/diagnostic-*/webkit-*/*.json
            ${{ runner.temp }}/diagnostic-*/chromium-*/*.png
            ${{ runner.temp }}/diagnostic-*/webkit-*/*.png
            ${{ runner.temp }}/diagnostic-*/case-*/*.json
            ${{ runner.temp }}/diagnostic-*/case-*/*.png
            ${{ runner.temp }}/diagnostic-*/**/ownership.json
            ${{ runner.temp }}/diagnostic-*/**/source-manifest.json
          if-no-files-found: error
          retention-days: 14
