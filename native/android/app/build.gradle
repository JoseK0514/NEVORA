import groovy.json.JsonOutput
plugins { id 'com.android.application' }

android {
    namespace 'com.velani.nevora.development'
    compileSdk 36
    defaultConfig {
        applicationId 'com.velani.nevora.development'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'BACKEND_ORIGIN', JsonOutput.toJson(providers.gradleProperty('nevoraBackendOrigin').getOrElse(''))
    }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false; signingConfig null } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    // Android's platform JSONObject at runtime; a real implementation for JVM tests.
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-web:3.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
}
if (providers.gradleProperty('nevoraBuildDirectory').isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty('nevoraBuildDirectory').get()))
}
